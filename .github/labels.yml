# GitHub issue and PR labels
# Apply with: gh label create --force (or use a label sync action)

- name: bug
  color: "d73a4a"
  description: Something is not working correctly

- name: enhancement
  color: "a2eeef"
  description: New feature or improvement

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

- name: security
  color: "e4e669"
  description: Security-related issue or fix

- name: dependencies
  color: "0366d6"
  description: Dependency update

- name: python
  color: "3572A5"
  description: Python dependency

- name: github-actions
  color: "000000"
  description: GitHub Actions workflow

- name: triage
  color: "e4e669"
  description: Needs triage

- name: good first issue
  color: "7057ff"
  description: Good for newcomers

- name: help wanted
  color: "008672"
  description: Extra attention is needed

- name: wontfix
  color: "ffffff"
  description: This will not be worked on

- name: duplicate
  color: "cfd3d7"
  description: This issue or PR already exists

- name: breaking change
  color: "b60205"
  description: Introduces a breaking change

- name: performance
  color: "fbca04"
  description: Performance improvement

- name: refactor
  color: "bfd4f2"
  description: Code refactor with no behaviour change

- name: ha
  color: "c5def5"
  description: High-availability related

- name: crypto
  color: "f9d0c4"
  description: Cryptography, CA, or certificate related

- name: alerting
  color: "fef2c0"
  description: Alerting or anomaly detection related
