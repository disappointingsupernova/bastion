name: Feature request
description: Suggest a new feature or improvement
labels: [enhancement, triage]
assignees:
  - disappointingsupernova

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Please describe the use case clearly — we prioritise features based on real-world need.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this feature solve? What are you trying to do that you cannot do today?
      placeholder: I need to be able to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like to see. Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative approaches or workarounds?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Bastion does this relate to?
      options:
        - Authentication / MFA
        - SSH certificates / CA
        - Session recording
        - Anomaly detection
        - Alerting
        - Remote provisioning
        - Package management
        - CLI
        - API
        - HA / database
        - Security
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, screenshots, or references.
