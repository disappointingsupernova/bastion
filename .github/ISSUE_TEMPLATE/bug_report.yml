name: Bug report
description: Report a bug or unexpected behaviour in Bastion
labels: [bug, triage]
assignees:
  - disappointingsupernova

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible.

        **For security vulnerabilities, do not use this form.** See [SECURITY.md](../SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run `bastion login`
        2. Run `bastion connect server1.example.com`
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include any error messages or log output.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Bastion version
      description: Output of `git describe --tags` or the release tag
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 22.04 LTS
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.8"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant log output here. Remove any sensitive information.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context that might be relevant.
