version: 2

updates:
  # Python dependencies
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    reviewers:
      - disappointingsupernova
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
    groups:
      fastapi:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "starlette*"
      sqlalchemy:
        patterns:
          - "sqlalchemy*"
          - "alembic*"
          - "aiosqlite*"
          - "psycopg2*"
          - "asyncpg*"
      celery:
        patterns:
          - "celery*"
          - "redis*"
      crypto:
        patterns:
          - "cryptography*"
          - "bcrypt*"
          - "python-jose*"
          - "pyotp*"
      aws:
        patterns:
          - "boto3*"
          - "botocore*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    reviewers:
      - disappointingsupernova
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions)"
