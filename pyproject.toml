[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion"
version = "0.1.0"
description = "SSH Bastion/Jumphost service with certificate authority, session recording, and remote server management"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "disappointingsupernova" }
]
keywords = ["ssh", "bastion", "jumphost", "certificate-authority", "security", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Auth & crypto
    "bcrypt>=4.1.3",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "pyotp>=2.9.0",

    # SSH
    "asyncssh>=2.14.2",

    # Database & ORM
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",

    # Task queue
    "celery[redis]>=5.3.6",
    "redis>=5.0.3",

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.1",

    # Alerting
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "aiosmtplib>=3.0.1",

    # Logging
    "structlog>=24.1.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",

    # Rate limiting
    "slowapi>=0.1.9",
]

[project.scripts]
bastion = "cli.main:app"
bastion-admin = "cli.admin:app"

[project.urls]
Homepage = "https://github.com/disappointingsupernova/bastion"
Repository = "https://github.com/disappointingsupernova/bastion"
Issues = "https://github.com/disappointingsupernova/bastion/issues"
Changelog = "https://github.com/disappointingsupernova/bastion/blob/main/CHANGELOG.md"
Security = "https://github.com/disappointingsupernova/bastion/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit[toml]>=1.7.8",
    "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bastion*", "bastion_api*", "bastion_admin*", "cli*", "workers*"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["bastion", "bastion_api", "bastion_admin", "cli", "workers"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# ── bandit ────────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]  # assert statements in tests
