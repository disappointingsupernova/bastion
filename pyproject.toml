[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bastion"
version = "0.1.0"
description = "SSH Bastion/Jumphost service with certificate authority, session recording, and remote server management"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Auth & crypto
    "bcrypt>=4.1.3",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "pyotp>=2.9.0",
    "age-encryption>=0.1.0",

    # SSH
    "paramiko>=3.4.0",
    "asyncssh>=2.14.2",

    # Database & ORM
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",

    # Task queue
    "celery[redis]>=5.3.6",
    "redis>=5.0.3",

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.1",

    # Alerting
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "aiosmtplib>=3.0.1",

    # Logging
    "structlog>=24.1.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",

    # Scheduling
    "apscheduler>=3.10.4",

    # Rate limiting
    "slowapi>=0.1.9",
]

[project.scripts]
bastion = "cli.main:app"
bastion-admin = "cli.admin:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["bastion*", "bastion_api*", "bastion_admin*", "cli*", "workers*"]
